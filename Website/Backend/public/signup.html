<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ISCHS Senior 2026-2027 Funds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <!-- Decorative glowing blobs -->
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <!-- Back arrow -->
    <a class="back-link" href="index.html" aria-label="Back to home page">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>Back</span>
    </a>

    <main class="signup-wrap">
        <img src="Images/ISCHS New Logo (PNG) (1).png" alt="ISCHS logo" id="logo">
        <h1>Create an Account</h1>
        <p class="subtitle">Join the ISCHS Senior 2026-2027 fundraiser</p>

        <form id="signup-form" class="signup-card" novalidate>

            <h2><span class="step">1</span> Personal Information</h2>
            <div class="row">
                <div class="field">
                    <input id="first-name" type="text" placeholder=" " autocomplete="given-name" required>
                    <label for="first-name">First name</label>
                </div>
                <div class="field">
                    <input id="last-name" type="text" placeholder=" " autocomplete="family-name" required>
                    <label for="last-name">Last name</label>
                </div>
            </div>

            <h2><span class="step">2</span> Account Security</h2>
            <div class="field">
                <input id="email" type="email" placeholder=" " autocomplete="email" required>
                <label for="email">Email address</label>
            </div>

            <div class="field">
                <input id="password" type="password" placeholder=" " autocomplete="new-password" maxlength="25" required>
                <label for="password">Password</label>
                <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
            </div>

            <!-- Strength meter + live checklist -->
            <div class="strength" aria-hidden="true">
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <span class="strength-text" id="strength-text">Enter a password</span>
            </div>

            <ul class="rules" id="rules">
                <li data-rule="length">8 to 25 characters</li>
                <li data-rule="upper">1 uppercase letter</li>
                <li data-rule="lower">1 lowercase letter</li>
                <li data-rule="number">1 number</li>
                <li data-rule="special">1 special character (like ! or *)</li>
            </ul>

            <div class="field">
                <input id="confirm" type="password" placeholder=" " autocomplete="new-password" maxlength="25" required>
                <label for="confirm">Confirm password</label>
                <button type="button" class="toggle-password" data-target="confirm" aria-label="Show password">Show</button>
            </div>

            <button type="submit" id="signup-button">
                <span class="btn-text">Create Account</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>

            <p class="form-message" id="form-message" aria-live="polite"></p>

            <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </main>
    <script src="signup.js"></script>
</body>
</html>
