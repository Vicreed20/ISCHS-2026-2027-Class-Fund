<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISCHS Senior 2026-2027 Funds</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
        
</head>
<body>
       <!-- Decorative glowing blobs -->
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <!-- Back arrow -->
    <a class="back-link" href="Index.html" aria-label="Back to home page">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>Back</span>
    </a>

    <main class="login-wrap">
        <img src="Images/ISCHS New Logo (PNG) (1).png" alt="ISCHS logo" id="logo">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log into your account</p>

        <form id="login-form" class="login-card" novalidate>
            <h2>Login</h2>

            <div class="field">
                <input id="email" type="email" placeholder=" " autocomplete="email" required>
                <label for="email">Email address</label>
            </div>

            <div class="field">
                <input id="password" type="password" placeholder=" " autocomplete="current-password" required>
                <label for="password">Password</label>
                <button type="button" id="toggle-password" class="toggle-password"
                        aria-label="Show password">Show</button>
            </div>

            <button type="submit" id="login-button">
                <span class="btn-text">Log In</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>

            <p class="form-message" id="form-message" aria-live="polite"></p>
        </form>

    </main>
    <script src="login.js"></script>
</body>
</html>
