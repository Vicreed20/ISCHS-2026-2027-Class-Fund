services:
  - type: web
    name: ischs-class-funds
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    # Free instances have no persistent disk, so accounts and site edits would be wiped.
    # "starter" is the cheapest plan that supports a disk.
    plan: starter
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
